<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | FJMB</title>
  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body class="auth">
  <main class="auth-card">
   
<a class="logo" href="index.html">
    <img src="imagens/mochila.png" alt="" class="logo-icon">
    <span>FJMB</span>
</a>

    <h1>Criar conta</h1>
    <p class="intro">Leva menos de um minuto. Depois podes candidatar-te a bolsas e pedir mentoria.</p>
    <form data-form="cadastro" novalidate>
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" autocomplete="name" required>
      </div>
      <div class="campo">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="linha-dupla">
        <div class="campo">
          <label for="contacto">Contacto</label>
          <input id="contacto" name="contacto" type="tel" autocomplete="tel" inputmode="numeric" pattern="9[0-9]{8}" maxlength="9" placeholder="9XXXXXXXX" title="9 dígitos, começando por 9" required>
        </div>
        <div class="campo">
          <label for="tipo">Sou</label>
          <select id="tipo" name="tipo" required>
            <option value="">Escolhe</option>
            <option value="estudante">Estudante</option>
            <option value="mentor">Mentor</option>
          </select>
        </div>
      </div>
      <div class="grupo" data-grupo="estudante" hidden>
        <div class="campo">
          <label for="curso">Curso</label>
          <input id="curso" name="curso" type="text" required>
        </div>
        <div class="campo">
          <label for="media_ensinomedio">Média do ensino médio (0 a 20)</label>
          <input id="media_ensinomedio" name="media_ensinomedio" type="number" min="0" max="20" step="0.1" required>
        </div>
      </div>
      <div class="grupo" data-grupo="mentor" hidden>
        <div class="campo">
          <label for="formacao">Formação</label>
          <input id="formacao" name="formacao" type="text" required>
        </div>
      </div>
      <div class="linha-dupla">
        <div class="campo">
          <label for="password">Palavra-passe</label>
          <div class="senha">
            <input id="password" name="password" type="password" autocomplete="new-password" minlength="8" required>
            <button type="button" data-toggle="password">Mostrar</button>
          </div>
        </div>
        <div class="campo">
          <label for="confirmar">Confirmar</label>
          <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" required>
        </div>
      </div>
      <div class="extra">
        <label><input type="checkbox" name="termos" required> Aceito os termos de uso</label>
      </div>
      <p class="msg" role="status"></p>
      <button class="btn" type="submit">Criar conta</button>
    </form>
    <p class="rodape-auth">Já tens conta? <a href="login.html">Entrar</a></p>
    <a class="voltar" href="index.html">Voltar ao início</a>
  </main>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
