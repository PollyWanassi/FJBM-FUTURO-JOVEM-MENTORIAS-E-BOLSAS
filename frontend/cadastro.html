<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Criar conta | FJMB</title>
  <link rel="stylesheet" href="css/cadastro.css">
</head>
<body class="auth">
  <main class="auth-card">
    <a class="logo" href="index.html">FJMB</a>
    <h1>Criar conta</h1>
    <p class="intro">Leva menos de um minuto. Depois podes candidatar-te a bolsas e pedir mentoria.</p>
    <form data-form="cadastro" novalidate>
      <div class="campo">
        <label for="nome">Nome completo</label>
        <input id="nome" name="nome" type="text" autocomplete="name" required>
      </div>
      <div class="campo">
        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email" required>
      </div>
      <div class="linha-dupla">
        <div class="campo">
          <label for="telefone">Telefone</label>
          <input id="telefone" name="telefone" type="tel" autocomplete="tel" required>
        </div>
        <div class="campo">
          <label for="perfil">Sou</label>
          <select id="perfil" name="perfil" required>
            <option value="">Escolhe</option>
            <option value="estudante">Estudante</option>
            <option value="mentor">Mentor</option>
          </select>
        </div>
      </div>
      <div class="campo">
        <label for="instituicao">Instituição de ensino</label>
        <input id="instituicao" name="instituicao" type="text" required>
      </div>
      <div class="linha-dupla">
        <div class="campo">
          <label for="senha">Palavra-passe</label>
          <div class="senha">
            <input id="senha" name="senha" type="password" autocomplete="new-password" minlength="8" required>
            <button type="button" data-toggle="senha">Mostrar</button>
          </div>
        </div>
        <div class="campo">
          <label for="confirmar">Confirmar</label>
          <input id="confirmar" name="confirmar" type="password" autocomplete="new-password" required>
        </div>
      </div>
      <div class="extra">
        <label><input type="checkbox" name="termos" required> Aceito os termos de uso</label>
      </div>
      <p class="msg" role="status"></p>
      <button class="btn" type="submit">Criar conta</button>
    </form>
    <p class="rodape-auth">Já tens conta? <a href="login.html">Entrar</a></p>
    <a class="voltar" href="index.html">Voltar ao início</a>
  </main>
  <script src="js/auth.js"></script>
</body>
</html>
